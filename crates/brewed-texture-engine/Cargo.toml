[package]
name = "brewed-texture-engine"
description = "GPU (wgpu) evaluation of Brewed Texture Designer graphs, multithreaded SIMD pixel kernels and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
brewed-texture-core.workspace = true
# The names of the files an export writes (shared by the programs of the set).
texture-export.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
half.workspace = true
wide.workspace = true
rayon.workspace = true
image.workspace = true
log.workspace = true
# OpenEXR of half floats (the image crate writes floats only); the version the image crate
# reads and writes EXR with.
exr = "1.74"
# The block compression of DDS outputs (BC1 to BC3), in Rust, on every core.
texpresso = { version = "2", features = ["rayon"] }
# The SVG and Text nodes: vector graphics and text drawn into pixels (the library iced draws its
# SVGs with, text included: nothing more to build).
resvg = { version = "0.45", default-features = false, features = ["text"] }
# Packed SVGs (.svgz) unpacked no larger than they may be (usvg would unpack any size); the
# version usvg unpacks them with.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# The benchmarks and the contact sheet of every node type (`tools`), for developing the program.
dev-tools = []

[[example]]
name = "contact_sheet"
required-features = ["dev-tools"]
