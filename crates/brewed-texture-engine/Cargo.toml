[package]
name = "brewed-texture-engine"
description = "GPU (wgpu) evaluation of Brewed Texture Designer graphs, multithreaded SIMD pixel kernels and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
brewed-texture-core.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
half.workspace = true
wide.workspace = true
rayon.workspace = true
image.workspace = true
log.workspace = true
# The SVG and Text nodes: vector graphics and text drawn into pixels (the library iced draws its
# SVGs with, text included: nothing more to build).
resvg = { version = "0.45", default-features = false, features = ["text"] }
