[package]
name = "brewed-texture-core"
description = "Document model of Brewed Texture Designer: node types, graph, expressions, edits, undo, project files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# Package files are ZIP archives (see `archive`): their entries deflated, and checked by CRC-32.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
# The files a package holds are named by the SHA-256 of their bytes (see `files`).
sha2 = "0.11"
# What a package's file holds is hashed and compressed on every core.
rayon.workspace = true
