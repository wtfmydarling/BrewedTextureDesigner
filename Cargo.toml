[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-engine", "crates/tessera"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://example.invalid/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-engine = { path = "crates/tessera-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# GPU. The version must match the one iced renders with, so that the engine and the UI
# share one device (the 2D view samples the engine's textures directly).
wgpu = "27"
pollster = "1"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck"] }

# CPU side: SIMD + threads.
wide = "1.7"
rayon = "1.12"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "tiff", "exr"] }

iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "crisp",
    "web-colors",
    "linux-theme-detection",
    "tokio",
    "canvas",
    "image",
    "svg",
    "advanced",
] }
rfd = "0.17"
futures = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
