[workspace]
resolver = "3"
members = ["crates/brewed-texture-core", "crates/brewed-texture-engine", "crates/brewed-texture-designer", "crates/home-screen"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://example.invalid/brewed-texture-designer"

[workspace.dependencies]
brewed-texture-core = { path = "crates/brewed-texture-core" }
brewed-texture-engine = { path = "crates/brewed-texture-engine" }
# The Home screen of the set of programs this one belongs to.
home-screen = { path = "crates/home-screen" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Without `regex`: log filters are plain module names here.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# GPU. The version must match the one iced renders with, so that the engine and the UI
# share one device (the 2D view samples the engine's textures directly).
wgpu = "27"
pollster = "1"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck"] }

# CPU side: SIMD + threads.
wide = "1.7"
rayon = "1.12"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "tiff", "exr", "hdr"] }

iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "crisp",
    "web-colors",
    "linux-theme-detection",
    "tokio",
    "canvas",
    # The image widget without every codec of the `image` crate (an AV1 encoder among
    # them): it shows pixels the engine made, and the codecs Bitmap reads are the ones
    # the `image` dependency below enables.
    "image-without-codecs",
    "svg",
    "advanced",
] }
rfd = "0.17"
futures = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
